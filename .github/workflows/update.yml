name: Update clan timeline

on:
  schedule:
    - cron: "1,11,21,31,41,51 * * * *"   # every 10 minutes (UTC; GitHub may run it a few minutes late)
  workflow_dispatch:           # adds a "Run workflow" button for manual refreshes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build timeline
        env:
          BM_TOKEN: ${{ secrets.BM_TOKEN }}
          TZ: Australia/Sydney     # timezone for summary.txt; the web page always uses each viewer's own time
        run: python rustlog.py timeline

      - name: Prepare site
        run: |
          mkdir site
          cp output/timeline.html site/index.html
          cp output/summary.txt site/summary.txt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Update pinned Discord message
        continue-on-error: true      # a Discord hiccup never breaks the page update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ vars.DISCORD_MESSAGE_ID }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python rustlog.py discord
